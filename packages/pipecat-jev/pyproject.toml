[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pipecat-jev"
version = "0.2.0"
description = "Deterministic voice IVR FrameProcessor and CLI for Pipecat powered by TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pipecat-ai>=1.16.0,<2.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "jsonschema>=4.22.0",
]

[project.optional-dependencies]
daily = ["pipecat-ai[daily]>=1.16.0,<2.0.0"]
deepgram = ["pipecat-ai[deepgram,silero,webrtc]>=1.16.0,<2.0.0"]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[project.scripts]
jev-ivr = "pipecat_jev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_jev"]

[tool.hatch.build.targets.sdist]
include = [
  "src/pipecat_jev",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
